<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CSA問題集">
<title>ServiceNow CSA 問題集</title>
<style>
:root{
  --bg:#0f172a; --bg2:#1e293b; --card:#1e293b; --card2:#273449;
  --text:#e2e8f0; --muted:#94a3b8; --border:#334155;
  --accent:#3b82f6; --accent2:#2563eb;
  --ok:#22c55e; --okbg:rgba(34,197,94,.15);
  --ng:#ef4444; --ngbg:rgba(239,68,68,.15);
  --warn:#f59e0b;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f1f5f9; --bg2:#e2e8f0; --card:#ffffff; --card2:#f8fafc;
    --text:#0f172a; --muted:#64748b; --border:#cbd5e1;
    --accent:#2563eb; --accent2:#1d4ed8;
    --ok:#16a34a; --okbg:rgba(22,163,74,.12);
    --ng:#dc2626; --ngbg:rgba(220,38,38,.12);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:820px; margin:0 auto; padding:16px 14px 60px}
.hidden{display:none!important}

/* ---- Header ---- */
header.app{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb,var(--bg) 85%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.head-in{max-width:820px;margin:0 auto;padding:12px 14px;display:flex;align-items:center;gap:12px}
.head-in h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px}
.head-in .sub{font-size:12px;color:var(--muted)}
.btn-back{
  background:var(--card2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:600;
}
.btn-back:active{transform:scale(.97)}
.spacer{flex:1}

/* ---- Home ---- */
.hero{text-align:center;padding:22px 6px 10px}
.hero h2{font-size:22px;margin:0 0 6px}
.hero p{color:var(--muted);margin:0;font-size:14px}
.opts{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  margin:18px 0 6px;
}
.chip{
  display:flex;align-items:center;gap:8px;background:var(--card);
  border:1px solid var(--border);border-radius:999px;padding:9px 14px;
  font-size:13px;cursor:pointer;user-select:none;font-weight:600;color:var(--muted)
}
.chip input{display:none}
.chip.on{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%, var(--card))}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--border)}
.chip.on .dot{background:var(--accent)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:16px}
.setcard{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:16px;cursor:pointer;transition:transform .08s, border-color .15s;
  display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;
}
.setcard:hover{border-color:var(--accent)}
.setcard:active{transform:scale(.98)}
.setcard .no{font-size:15px;font-weight:800}
.setcard .rng{font-size:12px;color:var(--muted)}
.setcard .cnt{font-size:12px;color:var(--muted)}
.setcard .best{
  margin-top:4px;font-size:12px;font-weight:700;color:var(--ok);
  display:flex;align-items:center;gap:5px
}
.setcard .bar{height:5px;border-radius:3px;background:var(--border);overflow:hidden;margin-top:6px}
.setcard .bar > i{display:block;height:100%;background:var(--ok)}
.reviewcard{grid-column:1/-1;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%, var(--card))}
.reviewcard .no{color:var(--accent)}
.reviewcard.disabled{opacity:.6;cursor:default;border-color:var(--border);background:var(--card)}
.reviewcard.disabled:hover{border-color:var(--border)}
.reviewcard.disabled .no{color:var(--muted)}
/* mode toggle */
.modeseg{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-top:14px;gap:4px}
.modeseg .seg{background:transparent;border:none;color:var(--muted);font-weight:700;font-size:14px;padding:9px 15px;border-radius:9px;cursor:pointer;transition:background .12s,color .12s}
.modeseg .seg:active{transform:scale(.97)}
.modeseg .seg.on{background:var(--accent);color:#fff}
/* memorize list */
.memohead{padding:14px 4px 2px}
.memohead h2{font-size:19px;margin:0 0 4px}
.memohead p{color:var(--muted);font-size:13px;margin:0}
.memocard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-top:12px}
.memocard .mq{font-size:15px;font-weight:700;line-height:1.65;margin:0 0 10px}
.memocard .mq .qn{color:var(--muted);margin-right:6px}
.memocard .ma{background:var(--okbg);border:1px solid var(--ok);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.6;margin-top:6px}
.memocard .ma .lab{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;background:var(--ok);color:#fff;border-radius:6px;font-weight:800;font-size:12px;margin-right:8px;vertical-align:middle}
.memocard .mex{font-size:13px;color:var(--muted);margin-top:10px;white-space:pre-wrap;line-height:1.75;border-top:1px dashed var(--border);padding-top:9px}

/* ---- Quiz ---- */
.qtop{display:flex;align-items:center;gap:12px;margin:6px 0 4px}
.progresswrap{flex:1}
.progresswrap .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px}
.progress{height:8px;background:var(--border);border-radius:5px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .25s}
.scorepill{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap
}

.qcard{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 16px;margin-top:14px}
.qmeta{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-weight:700}
.tag.multi{color:var(--warn);border-color:var(--warn)}
.qtext{font-size:17px;font-weight:700;margin:0 0 4px;line-height:1.6}

.choices{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.choice{
  display:flex;gap:12px;align-items:flex-start;background:var(--card2);
  border:1.5px solid var(--border);border-radius:12px;padding:13px 14px;
  cursor:pointer;transition:border-color .12s,background .12s;
}
.choice:hover{border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%, var(--card2))}
.choice .mk{
  flex:0 0 26px;height:26px;border-radius:7px;border:1.5px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;
  background:var(--card);
}
.choice.sel .mk{border-color:var(--accent);background:var(--accent);color:#fff}
.choice .ct{flex:1;font-size:15px;padding-top:2px}
.choice.correct{border-color:var(--ok);background:var(--okbg)}
.choice.correct .mk{border-color:var(--ok);background:var(--ok);color:#fff}
.choice.wrong{border-color:var(--ng);background:var(--ngbg)}
.choice.wrong .mk{border-color:var(--ng);background:var(--ng);color:#fff}
.choice.locked{cursor:default;pointer-events:none}

.explain{
  margin-top:14px;border-radius:12px;padding:14px;font-size:14px;
  border:1px solid var(--border);background:var(--card2);
}
.explain .rhead{font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.explain.ok .rhead{color:var(--ok)}
.explain.ng .rhead{color:var(--ng)}
.explain .ans{font-size:13px;color:var(--muted);margin-bottom:8px}
.explain .body{color:var(--text);white-space:pre-wrap;line-height:1.75}

.actions{display:flex;gap:10px;margin-top:16px}
.btn{
  flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;
  cursor:pointer;transition:transform .06s,opacity .12s;
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border);flex:0 0 auto;padding:14px 18px}

/* ---- Result ---- */
.result{text-align:center;padding:20px 6px}
.result .big{font-size:52px;font-weight:900;line-height:1;margin:10px 0}
.result .pct{font-size:16px;color:var(--muted);margin-bottom:4px}
.result .msg{font-size:15px;margin:10px 0 18px;font-weight:700}
.ring{width:150px;height:150px;margin:14px auto}
.review{margin-top:24px;text-align:left}
.review h3{font-size:15px;margin:0 0 10px}
.ritem{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;font-size:14px
}
.ritem .rq{font-weight:700;margin-bottom:6px}
.ritem .ra{font-size:13px;color:var(--muted)}
.ritem .ra b{color:var(--ok)}
.ritem .ex{font-size:13px;color:var(--muted);margin-top:8px;white-space:pre-wrap;border-top:1px dashed var(--border);padding-top:8px}
footer{text-align:center;color:var(--muted);font-size:11px;margin-top:30px}
</style>
</head>
<body>
<header class="app">
  <div class="head-in">
    <button class="btn-back hidden" id="backBtn">← 戻る</button>
    <div>
      <h1>ServiceNow CSA 問題集</h1>
      <div class="sub" id="headSub">全404問 / 30問ずつ</div>
    </div>
    <div class="spacer"></div>
  </div>
</header>

<div class="wrap">
  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <h2>学習セットを選ぶ</h2>
      <p id="homeHint">30問ずつに分割。好きなセットから始められます。</p>
      <div class="modeseg" id="modeSeg">
        <button class="seg on" data-mode="quiz">✏️ 問題を解く</button>
        <button class="seg" data-mode="memo">📖 暗記（一覧）</button>
      </div>
    </div>
    <div class="opts" id="opts">
      <label class="chip on" id="chipShuffle"><span class="dot"></span>問題をシャッフル</label>
      <label class="chip on" id="chipInstant"><span class="dot"></span>即時採点</label>
    </div>
    <div class="grid" id="setGrid"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="qtop">
      <div class="progresswrap">
        <div class="lbl"><span id="qCount">1 / 30</span><span id="qSetName">セット1</span></div>
        <div class="progress"><i id="qBar" style="width:0%"></i></div>
      </div>
      <div class="scorepill">◯ <span id="qScore">0</span></div>
    </div>
    <div class="qcard">
      <div class="qmeta" id="qMeta"></div>
      <p class="qtext" id="qText"></p>
      <div class="choices" id="qChoices"></div>
      <div class="explain hidden" id="qExplain"></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="submitBtn" disabled>解答する</button>
    </div>
  </section>

  <!-- RESULT -->
  <section id="result" class="hidden"></section>

  <!-- MEMORIZE -->
  <section id="memorize" class="hidden">
    <div class="memohead">
      <h2 id="memoTitle"></h2>
      <p id="memoSub"></p>
    </div>
    <div id="memoList"></div>
  </section>

  <footer>ローカルで動作 · データは端末外に送信されません</footer>
</div>

<script id="quiz-data" type="application/json">
[
  {
    "questionId": "csa71910334",
    "number": "1",
    "questionText": "Import Set Tableとは何ですか？",
    "choices": [
      {
        "label": "A",
        "text": "変換後にデータが配置されるテーブル"
      },
      {
        "label": "B",
        "text": "関係性を決定するテーブル"
      },
      {
        "label": "C",
        "text": "インポートされたレコードのステージング領域"
      },
      {
        "label": "D",
        "text": "Update Set情報のリポジトリ"
      }
    ],
    "correctAnswers": [
      "C"
    ],
    "explanation": "Import Set Tableは、ServiceNowにおいて外部システムからインポートされたデータを一時的に保存するステージング領域として機能します。データはここで変換マップやトランスフォームマップを通じて処理され、検証や変換が行われた後、最終的な宛先テーブル（通常は本番のServiceNowテーブル）に移動されます。選択肢Aの「変換後にデータが配置されるテーブル」は宛先テーブルを指しており、Import Set Tableではありません。選択肢DのUpdate Setは開発環境から本番環境への設定変更の移行に使用される機能で、データインポートとは異なります。"
  },
  {
    "questionId": "csa37903675",
    "number": "2",
    "questionText": "従業員がタブレットを選択し、それと一緒に購入する標準アクセサリオプション（キャリングケース、スクリーンクリーナー、タブレットスタンド、スクリーンプロテクター）を選択できるようにフォームを設定するよう求められました。どのようなアプローチを取りますか？（3つ選択）",
    "choices": [
      {
        "label": "A",
        "text": "Records producerを作成し、フォーム上で各アクセサリオプションのチェックボックス変数を追加する"
      },
      {
        "label": "B",
        "text": "ショッピングカート設定で、Add Accessoriesボタンを表示するオプションを選択する"
      },
      {
        "label": "C",
        "text": "タブレット、キャリングケース、スクリーンクリーナー、タブレットスタンド、スクリーンプロテクターそれぞれに対してCatalog itemを作成する"
      },
      {
        "label": "D",
        "text": "タブレット用のCatalog itemを作成し、フォーム上で各アクセサリオプションのチェックボックス変数を追加する"
      },
      {
        "label": "E",
        "text": "タブレット用のCatalog itemを作成し、アクセサリオプション用の変数セットをフォームに追加する"
      }
    ],
    "correctAnswers": [
      "C",
      "D",
      "E"
    ],
    "explanation": "ServiceNowのService Catalogにおいて、この要件を満たすには複数のアプローチが可能です。選択肢Cでは各アイテムを独立したCatalog itemとして作成し、関連アイテムとして設定できます。選択肢Dでは単一のCatalog itemにチェックボックス変数を追加して、ユーザーがアクセサリを選択できるようにします。選択肢Eでは変数セットを使用してアクセサリオプションをグループ化し、再利用可能な形で管理できます。Records producerは通常、より複雑なワークフローや複数テーブルへの書き込みが必要な場合に使用されるため、この単純な商品選択には適していません。選択肢Bのような標準機能は存在しません。"
  },
  {
    "questionId": "csa42651127",
    "number": "3",
    "questionText": "フィルター条件の3つの構成要素は何ですか？",
    "choices": [
      {
        "label": "A",
        "text": "Field（フィールド）、Condition（条件）、Value（値）"
      },
      {
        "label": "B",
        "text": "Condition（条件）、Operator（演算子）、Value（値）"
      },
      {
        "label": "C",
        "text": "Variable（変数）、Field（フィールド）、Value（値）"
      },
      {
        "label": "D",
        "text": "Field（フィールド）、Operator（演算子）、Value（値）"
      }
    ],
    "correctAnswers": [
      "D"
    ],
    "explanation": "ServiceNowのフィルター条件は、Field（フィールド）、Operator（演算子）、Value（値）の3つの要素で構成されます。例えば「State equals Active」のように、どのフィールドに対して、どのような条件で、どの値と比較するかを指定します。選択肢AのCondition（条件）は実際にはOperator（演算子）の別の表現であり、正確な用語ではありません。選択肢CのVariable（変数）はフィルター条件の基本構成要素ではありません。"
  },
  {
    "questionId": "csa94111931",
    "number": "4",
    "questionText": "レコード内でフィールドと一緒に保存されないアイテムを追跡するために使用される要素は何ですか？",
    "choices": [
      {
        "label": "A",
        "text": "Dictionary"
      },
      {
        "label": "B",
        "text": "List Editor"
      },
      {
        "label": "C",
        "text": "Sidebar"
      },
      {
        "label": "D",
        "text": "Activity formatter"
      }
    ],
    "correctAnswers": [
      "D"
    ],
    "explanation": "Activity formatterは、レコードのフィールドとして保存されない情報（アクティビティ、コメント、作業ノート、履歴など）を表示・追跡するために使用されます。これにより、レコードの履歴や関連する活動を時系列で視覚的に確認できます。Dictionaryはテーブル構造の定義、List Editorはリスト表示の設定、Sidebarは画面の側面に表示される情報パネルを指し、いずれもアクティビティの追跡とは異なる機能です。"
  },
  {
    "questionId": "csa94127082",
    "number": "5",
    "questionText": "ユーザーはどのテーブルに保存されますか？",
    "choices": [
      {
        "label": "A",
        "text": "User [sys_user]"
      },
      {
        "label": "B",
        "text": "User [sys_user_group]"
      },
      {
        "label": "C",
        "text": "User [syst_user_profile]"
      },
      {
        "label": "D",
        "text": "User [user_profile]"
      }
    ],
    "correctAnswers": [
      "A"
    ],
    "explanation": "ServiceNowでは、ユーザー情報はsys_userテーブルに保存されます。このテーブルには、ユーザーの基本情報、認証情報、ロール割り当て、部署情報などが含まれています。選択肢Bのsys_user_groupはユーザーグループの情報を保存するテーブルです。選択肢CとDのテーブル名は存在しない、または正確ではありません。"
  },
  {
    "questionId": "csa76935851",
    "number": "6",
    "questionText": "Service Catalogアプリケーションで、管理者が新しいアイテムの作成を開始するためにアクセスするモジュールは何ですか？",
    "choices": [
      {
        "label": "A",
        "text": "Maintain Categories"
      },
      {
        "label": "B",
        "text": "Maintain Items"
      },
      {
        "label": "C",
        "text": "Content Items"
      },
      {
        "label": "D",
        "text": "Items"
      }
    ],
    "correctAnswers": [
      "B"
    ],
    "explanation": "Service Catalogで新しいカタログアイテムを作成する際は、Maintain Itemsモジュールを使用します。このモジュールから、新しいCatalog ItemやRecord Producerなどを作成・管理できます。Maintain Categoriesはカテゴリの管理用、Content ItemsやItemsは既存アイテムの表示・編集用のモジュールであり、新規作成の開始点ではありません。"
  },
  {
    "questionId": "csa10534271",
    "number": "7",
    "questionText": "これらのアプリケーションのうち、すべてのユーザーが利用できるものはどれですか？",
    "choices": [
      {
        "label": "A",
        "text": "Change"
      },
      {
        "label": "B",
        "text": "Incident"
      },
      {
        "label": "C",
        "text": "Facilities"
      },
      {
        "label": "D",
        "text": "Self-Service"
      }
    ],
    "correctAnswers": [
      "D"
    ],
    "explanation": "Self-Serviceアプリケーションは、すべてのユーザーがアクセスできるように設計されています。これにより、ユーザーは自分でサービスリクエストを作成したり、ナレッジベースを検索したり、カタログアイテムを注文したりできます。Change、Incident、Facilitiesアプリケーションは、特定のロールや権限を持つユーザーのみがアクセスできる管理者向けの機能です。"
  },
  {
    "questionId": "csa69922916",
    "number": "8",
    "questionText": "App Navigatorの検索フィールドを使用した検索で、何が返されますか？（4つ選択）",
    "choices": [
      {
        "label": "A",
        "text": "アプリケーションとモジュールの名前"

<script>
"use strict";
const RAW = JSON.parse(document.getElementById('quiz-data').textContent);
const CHUNK = 30;
const STORE = 'csa_quiz_best_v1';

// ---- helpers ----
const $ = id => document.getElementById(id);
const el = (t, c, h) => { const e = document.createElement(t); if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
function loadBest(){ try{ return JSON.parse(localStorage.getItem(STORE))||{}; }catch(_){ return {}; } }
function saveBest(o){ try{ localStorage.setItem(STORE, JSON.stringify(o)); }catch(_){} }
// 問題ごとの「直近の正誤」: { questionId: { r:0|1, t:epoch_ms } }
const QSTORE = 'csa_quiz_qres_v1';
function loadQr(){ try{ return JSON.parse(localStorage.getItem(QSTORE))||{}; }catch(_){ return {}; } }
function saveQr(o){ try{ localStorage.setItem(QSTORE, JSON.stringify(o)); }catch(_){} }
function wrongIds(){ const q=loadQr(); return Object.keys(q).filter(id=>q[id]&&q[id].r===0); }
function wrongItems(){ const w=new Set(wrongIds()); return RAW.filter(x=>w.has(x.questionId)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ---- build sets ----
const SETS = [];
for(let i=0;i<RAW.length;i+=CHUNK){
  const items = RAW.slice(i, i+CHUNK);
  SETS.push({ idx:SETS.length, from:i+1, to:i+items.length, items });
}
$('headSub').textContent = `全${RAW.length}問 / ${CHUNK}問ずつ`;

// ---- options ----
const opt = { shuffle:true, instant:true };
function bindChip(id, key){
  const c=$(id);
  c.addEventListener('click',()=>{ opt[key]=!opt[key]; c.classList.toggle('on',opt[key]); });
}
bindChip('chipShuffle','shuffle');
bindChip('chipInstant','instant');

// ---- 学習モード切替（問題を解く / 暗記一覧） ----
let mode = 'quiz';
document.querySelectorAll('#modeSeg .seg').forEach(b=>{
  b.addEventListener('click',()=>{
    mode = b.dataset.mode;
    document.querySelectorAll('#modeSeg .seg').forEach(x=>x.classList.toggle('on', x===b));
    $('opts').classList.toggle('hidden', mode==='memo'); // 採点/シャッフルは解答モード用
    renderHome();
  });
});

// ---- home ----
function renderHome(){
  const memo = (mode==='memo');
  $('homeHint').textContent = memo
    ? '暗記モード：セットを選ぶと問題文・正解・解説を一覧表示します。'
    : '30問ずつに分割。好きなセットから始められます。';
  const best = loadBest();
  const grid = $('setGrid'); grid.innerHTML='';
  // 復習（間違えた問題だけ）
  const nWrong = wrongIds().length;
  const rc = el('div','setcard reviewcard');
  rc.innerHTML = `<div class="no">🔁 ${memo?'間違いを暗記':'復習モード'}</div>
    <div class="rng">${memo?'間違えた問題を一覧で確認':'直近で間違えた問題だけを出題'}</div>
    <div class="cnt">${nWrong>0 ? '対象 '+nWrong+' 問' : 'まだ間違えた問題はありません'}</div>`;
  if(nWrong>0) rc.addEventListener('click', ()=> memo ? startMemorize(wrongItems(),'🔁 復習（間違えた問題）') : startReview());
  else rc.classList.add('disabled');
  grid.appendChild(rc);
  SETS.forEach(s=>{
    const card = el('div','setcard');
    const b = best['s'+s.idx];
    let bestHtml = '';
    if(b){
      const pct = Math.round(b.correct/b.total*100);
      bestHtml = `<div class="best">★ ベスト ${b.correct}/${b.total} (${pct}%)</div>
        <div class="bar"><i style="width:${pct}%"></i></div>`;
    }
    card.innerHTML = `<div class="no">セット ${s.idx+1}</div>
      <div class="rng">問題 ${s.from} – ${s.to}</div>
      <div class="cnt">全 ${s.items.length} 問</div>${bestHtml}`;
    card.addEventListener('click',()=> memo ? startMemorize(s.items, `セット ${s.idx+1}`) : startQuiz(s));
    grid.appendChild(card);
  });
}

// ---- quiz state ----
let Q = null;

function startQuiz(set){
  Q = {
    set, review:false, label:`セット ${set.idx+1}`,
    list: opt.shuffle ? shuffle(set.items) : set.items.slice(),
    pos: 0, score: 0, answered:false, selected:new Set(),
    wrongs:[]
  };
  enterQuiz();
}
function startReview(){
  const items = wrongItems();
  if(!items.length){ alert('間違えた問題はありません。'); renderHome(); show('home'); return; }
  Q = {
    set:null, review:true, label:'🔁 復習（間違えた問題）',
    list: opt.shuffle ? shuffle(items) : items.slice(),
    pos: 0, score: 0, answered:false, selected:new Set(),
    wrongs:[]
  };
  enterQuiz();
}
function enterQuiz(){
  show('quiz');
  $('backBtn').classList.remove('hidden');
  $('qSetName').textContent = Q.label;
  renderQuestion();
}

function show(name){
  ['home','quiz','result','memorize'].forEach(n=> $(n).classList.toggle('hidden', n!==name));
  if(name==='home') $('backBtn').classList.add('hidden');
  window.scrollTo(0,0);
}

// ---- 暗記モード（問題文＋正解＋解説の一覧） ----
function startMemorize(items, label){
  const list = $('memoList'); list.innerHTML='';
  $('memoTitle').textContent = '📖 暗記モード — '+label;
  $('memoSub').textContent = `全 ${items.length} 問 · 問題文と正解・解説を一覧表示`;
  items.forEach((q,i)=>{
    const correctSet = new Set(q.correctAnswers);
    const corr = q.choices.filter(c=>correctSet.has(c.label));
    const card = el('div','memocard');
    const ansHtml = corr.map(()=>`<div class="ma"><span class="lab"></span><span class="atext"></span></div>`).join('');
    card.innerHTML = `<p class="mq"><span class="qn">Q${q.number||(i+1)}</span><span class="qt"></span></p>${ansHtml}<div class="mex"></div>`;
    card.querySelector('.qt').textContent = q.questionText;
    const maNodes = card.querySelectorAll('.ma');
    maNodes.forEach((n,idx)=>{ n.querySelector('.lab').textContent=corr[idx].label; n.querySelector('.atext').textContent=corr[idx].text; });
    card.querySelector('.mex').textContent = q.explanation || '（解説なし）';
    list.appendChild(card);
  });
  show('memorize');
  $('backBtn').classList.remove('hidden');
}

function letters(arr){ return arr.slice().sort().join('、'); }

function renderQuestion(){
  const q = Q.list[Q.pos];
  Q.answered=false; Q.selected=new Set();
  const multi = (q.correctAnswers||[]).length>1;
  q._multi = multi;

  $('qCount').textContent = `${Q.pos+1} / ${Q.list.length}`;
  $('qScore').textContent = Q.score;
  $('qBar').style.width = ((Q.pos)/Q.list.length*100)+'%';

  const meta=$('qMeta'); meta.innerHTML='';
  meta.appendChild(el('span','tag','Q'+(q.number||(Q.pos+1))));
  if(multi) meta.appendChild(el('span','tag multi', `複数選択（${q.correctAnswers.length}個）`));

  $('qText').textContent = q.questionText;

  const box=$('qChoices'); box.innerHTML='';
  q.choices.forEach(ch=>{
    const c = el('div','choice');
    c.dataset.label = ch.label;
    c.innerHTML = `<div class="mk">${ch.label}</div><div class="ct"></div>`;
    c.querySelector('.ct').textContent = ch.text;
    c.addEventListener('click',()=>toggle(c, ch.label, multi));
    box.appendChild(c);
  });

  const ex=$('qExplain'); ex.className='explain hidden';
  const btn=$('submitBtn');
  btn.textContent='解答する'; btn.disabled=true; btn.onclick=submit;
}

function toggle(node, label, multi){
  if(Q.answered) return;
  if(multi){
    if(Q.selected.has(label)){ Q.selected.delete(label); node.classList.remove('sel'); }
    else { Q.selected.add(label); node.classList.add('sel'); }
  } else {
    Q.selected.clear();
    document.querySelectorAll('.choice').forEach(n=>n.classList.remove('sel'));
    Q.selected.add(label); node.classList.add('sel');
  }
  $('submitBtn').disabled = Q.selected.size===0;
}

function submit(){
  if(!Q.answered){
    // grade
    const q = Q.list[Q.pos];
    Q.answered=true;
    const correct = new Set(q.correctAnswers);
    const sel = Q.selected;
    const isRight = sel.size===correct.size && [...sel].every(x=>correct.has(x));
    if(isRight) Q.score++;
    else Q.wrongs.push(q);
    $('qScore').textContent = Q.score;

    // この問題の「直近の正誤」を記録（復習モードの判定に使用）
    const qr=loadQr(); qr[q.questionId]={ r:isRight?1:0, t:Date.now() }; saveQr(qr);

    // lock + color
    document.querySelectorAll('.choice').forEach(n=>{
      n.classList.add('locked');
      const lb=n.dataset.label;
      if(correct.has(lb)) n.classList.add('correct');
      else if(sel.has(lb)) n.classList.add('wrong');
    });

    // explanation
    const ex=$('qExplain');
    ex.className = 'explain '+(isRight?'ok':'ng');
    ex.innerHTML =
      `<div class="rhead">${isRight?'✓ 正解':'✗ 不正解'}</div>
       <div class="ans">正解: <b>${letters(q.correctAnswers)}</b></div>
       <div class="body"></div>`;
    ex.querySelector('.body').textContent = q.explanation || '（解説なし）';

    const last = Q.pos===Q.list.length-1;
    const btn=$('submitBtn');
    btn.disabled=false;
    btn.textContent = last ? '結果を見る' : '次の問題 →';
    $('qBar').style.width = ((Q.pos+1)/Q.list.length*100)+'%';
    ex.scrollIntoView({behavior:'smooth',block:'nearest'});
  } else {
    // next
    if(Q.pos===Q.list.length-1) finish();
    else { Q.pos++; renderQuestion(); window.scrollTo(0,0); }
  }
}

function finish(){
  const total=Q.list.length, correct=Q.score, pct=total?Math.round(correct/total*100):0;
  // セットのベストスコア保存（復習モードでは保存しない）
  if(!Q.review){
    const best=loadBest(); const key='s'+Q.set.idx;
    if(!best[key] || correct>best[key].correct){ best[key]={correct,total}; saveBest(best); }
  }

  const msg = Q.review
    ? (pct>=100?'全問クリア！お見事 🎉': pct>=50?'正解した問題は復習対象から外れます':'もう一周して定着させましょう')
    : (pct>=90?'素晴らしい！合格ラインです 🎉': pct>=70?'いい調子。あと少し！': pct>=50?'復習して再挑戦しましょう':'基礎から見直しましょう');
  const R=$('result'); R.innerHTML='';
  const circ = 2*Math.PI*52;
  const off = circ*(1-pct/100);
  const color = pct>=70?'var(--ok)':pct>=50?'var(--warn)':'var(--ng)';

  const headLabel = Q.review ? `🔁 復習 · ${total}問` : `セット ${Q.set.idx+1} · 問題 ${Q.set.from}–${Q.set.to}`;
  R.appendChild(el('div','result',
    `<div class="pct">${headLabel}</div>
     <svg class="ring" viewBox="0 0 120 120">
       <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" stroke-width="12"/>
       <circle cx="60" cy="60" r="52" fill="none" stroke="${color}" stroke-width="12"
         stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"
         transform="rotate(-90 60 60)"/>
       <text x="60" y="66" text-anchor="middle" font-size="26" font-weight="800" fill="var(--text)">${pct}%</text>
     </svg>
     <div class="big">${correct} / ${total}</div>
     <div class="msg">${msg}</div>
     <div class="actions">
       <button class="btn ghost" id="retryBtn">もう一度</button>
       <button class="btn primary" id="homeBtn">セット選択へ</button>
     </div>`));

  if(Q.wrongs.length){
    const rev = el('div','review');
    rev.appendChild(el('h3',null,`間違えた問題（${Q.wrongs.length}）`));
    Q.wrongs.forEach(q=>{
      const it=el('div','ritem',
        `<div class="rq"></div>
         <div class="ra">正解: <b>${letters(q.correctAnswers)}</b></div>
         <div class="ex"></div>`);
      it.querySelector('.rq').textContent = 'Q'+(q.number||'')+'  '+q.questionText;
      it.querySelector('.ex').textContent = q.explanation||'';
      rev.appendChild(it);
    });
    R.querySelector('.result').appendChild(rev);
  }
  show('result');
  $('retryBtn').onclick=()=> Q.review ? startReview() : startQuiz(Q.set);
  $('homeBtn').onclick=()=>{ renderHome(); show('home'); };
}

$('backBtn').addEventListener('click',()=>{
  const inQuiz = !$('quiz').classList.contains('hidden');
  if(inQuiz && Q && Q.pos>0 && !Q.answered && !confirm('学習を中断してセット選択に戻りますか？')) return;
  renderHome(); show('home');
});

// init
renderHome();
show('home');
</script>
